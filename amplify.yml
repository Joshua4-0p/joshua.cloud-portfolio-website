version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands: ['nvm install 22', 'nvm use 22', 'npm ci']
        build:
          commands: ['npm run build', 'npm run pii']
      artifacts: { baseDirectory: out, files: ['**/*'] }
      cache: { paths: ['node_modules/**/*'] }

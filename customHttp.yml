# Amplify reads custom headers for a monorepo from the repo root, keyed by appRoot.
applications:
  - appRoot: web
    customHeaders:
      - pattern: '**'
        headers:
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
          - key: X-Content-Type-Options
            value: nosniff
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: camera=(), microphone=(), geolocation=()
          - key: X-Frame-Options
            value: DENY
          - key: Content-Security-Policy
            value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://wr3ti5s9xj.execute-api.us-east-1.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - pattern: '_next/static/**'
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
